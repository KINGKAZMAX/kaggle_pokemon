function show(d){const root=$('detail');root.replaceChildren();put(root,'h2',d.title);put(root,'span',d.id+' · '+label(d),'badge');put(root,'span',d.total+' 张 / '+Object.keys(d.counts).length+' 个 ID','badge');for(const [k,n] of Object.entries(d.class_counts))put(root,'span',k+' '+n,'badge');put(root,'p',d.tactics.kind+'：'+d.tactics.summary,'note');if(d.historical_submission_links.length){put(root,'h3','有明确牌组路径关联的历史提交');for(const rec of d.historical_submission_links){const p=put(root,'p',rec.title+' · refs '+rec.refs.join(', '));const a=put(p,'a',' 查看公开仓库历史解释');a.href='https://github.com/KINGKAZMAX/kaggle_pokemon/blob/HEAD/eval/AGENT_CATALOG_FULL.md';a.rel='noopener noreferrer'}put(root,'p','关联来自归档文档记载；不是今天重新验证，也不代表本构成所有来源都被提交。','meta')}else put(root,'p','此索引未绑定明确提交 ref；可能为候选、对手提取或本机研究。','meta');const grid=put(root,'div',undefined,'slots'),seen={};d.slots.forEach((id,n)=>{const c=cards[id],box=put(grid,'div',undefined,'card');seen[id]=(seen[id]||0)+1;put(box,'span',String(n+1).padStart(2,'0')+' · 拷贝 '+seen[id]+'/'+d.counts[id],'slotno');put(box,'b',c.name);put(box,'div','ID '+id);put(box,'div',c.class,'meta');put(box,'div',c.expansion+' '+c.collection_no,'meta')});put(root,'h3','构成汇总');const table=put(root,'table'),head=put(table,'tr');['ID','名称 / 版本','种类','张数'].forEach(x=>put(head,'th',x));for(const [id,n] of Object.entries(d.counts)){const c=cards[id],tr=put(table,'tr');[id,c.name+' · '+c.expansion+' '+c.collection_no,c.class,n].forEach(x=>put(tr,'td',x))}const det=put(root,'details');put(det,'summary','来源路径（'+d.sources.length+'）');const ul=put(det,'ul');d.sources.forEach(s=>put(ul,'li',s));put(root,'p','槽位保留源 CSV 原顺序，仅为输入排列，不是洗牌顺序或最佳出牌顺序。未使用官方卡图或卡牌效果全文。','meta')}
['q','lineage','kind'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));render();
</script></html>
